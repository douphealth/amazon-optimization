[project]
name = "amazon-commission-engine"
version = "0.2.0"
description = "Audit, rank and fix Amazon affiliate links across a portfolio of content sites."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0", "google-auth>=2.30"]

[project.scripts]
ace = "ace.cli:main"

[tool.setuptools]
packages = ["ace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
