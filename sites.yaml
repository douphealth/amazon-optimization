# Portfolio config. One entry per site that carries (or should carry) Amazon links.
# tags: the Associates tracking IDs this site is expected to use. Leave empty to
#       accept any tag that starts with account_tag_prefix.
# gsc_property: the Search Console property (`ace pull` falls back to the domain or URL-prefix property it can see).
# ga4_properties: Google Analytics 4 property IDs; the first that records visits for the site is used.
# bing_site: the Bing Webmaster site URL, only needed when it differs from https://<domain>/.

# GitHub repository this engine lives in. The dashboard's buttons link to it.
repository: douphealth/amazon-optimization

account_tag_prefix: papalex
marketplace: www.amazon.com
# The tracking ID product boxes use on sites with no tag of their own (tags: []).
default_tag: papalex-20

# Products whose links should no longer be used. The fixer points each link at an Amazon search:
# the link's own text when it is descriptive, otherwise the fallback phrase given here.
blocked_asins:
  # Linked as Miracle-Gro potting mix. The page now shows Miracle-Gro Indoor Plant Food
  # (data check 2026-11-25, confirmed by the site owner 2026-11-26).
  B084KRDD5F: "Miracle-Gro indoor potting mix"

# Fixes `ace fix --apply` may make on its own. Remove a name to switch that fix off.
# See ace/fixer.py for exactly what each one does.
# `tags` is off: on these sites tracking IDs are set when the page is rendered (the "Hermes
# Portfolio Amazon Product Box OS" code snippet), so editing the post body does not change the
# live page. Verified 2026-11-26. Decision 2026-11-26: that snippet owns tracking IDs; this engine
# owns product boxes, link attributes, blocked-product links and missing disclosures.
# `disclosure` only touches pages whose live HTML shows Amazon links and no affiliate statement,
# i.e. pages the "PGCC Amazon disclosure" snippet does not cover.
auto_fix: [rel, blocked, box, disclosure]

# Auto-generated boxes go on pages with at least this many measured visits. 0 = every page whose
# first Amazon link sits late, measured or not (owner's instruction 2026-11-26: fix all findings).
# A box only repeats products the page already links to.
box_min_clicks: 0

defaults:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
  max_urls: 1500
  concurrency: 4
  # Sitemaps whose URL matches this regex are skipped (taxonomy archives).
  skip_sitemaps: "(category|post_tag|tag|author|product_cat)-sitemap|sitemap-(categories|tags|authors)"

sites:
  - domain: gearuptofit.com
    name: GearUpToFit
    gsc_property: "https://gearuptofit.com/"   # a URL-prefix property: the account has no domain property for this site
    ga4_properties: [250003756, 375653719]
    tags: [papalex-gutf-20]
    skip_fix: "^/watch-match/"   # a separate app, not WordPress

  - domain: plantastichaven.com
    name: Plantastic Haven
    gsc_property: "sc-domain:plantastichaven.com"
    ga4_properties: [378647208]
    tags: [papalex-ph-20]

  - domain: micegoneguide.com
    name: Mice Gone Guide
    gsc_property: "sc-domain:micegoneguide.com"
    ga4_properties: [546636374]
    tags: [papalex-mgg-20]

  - domain: gearuptogrow.com
    name: GearUpToGrow
    gsc_property: "sc-domain:gearuptogrow.com"
    ga4_properties: [300847192]
    tags: [papalex-gutg-20]

  - domain: affiliatemarketingforsuccess.com
    name: Affiliate Marketing for Success
    gsc_property: "sc-domain:affiliatemarketingforsuccess.com"
    ga4_properties: [260509481]
    tags: [papalex-amfs-20]

  - domain: frenchyfab.com
    name: FrenchyFab
    gsc_property: "sc-domain:frenchyfab.com"
    ga4_properties: [409497113, 407291494]
    tags: [papalex-ff-20]

  - domain: mysticaldigits.com
    name: Mystical Digits
    # Its server timed out twice on 2026-11-28 under a run of saves (even 8 s apart): at most 40
    # edits per run, 8 s apart, so the remaining product boxes go in over a few runs.
    max_fixes_per_run: 40
    fix_pause: 8
    gsc_property: "sc-domain:mysticaldigits.com"
    ga4_properties: [387055444]
    tags: [papalex-md-20]

  - domain: outdoormisting.com
    name: Outdoor Misting
    gsc_property: "sc-domain:outdoormisting.com"
    tags: []
    wordpress: false

  - domain: efficientgptprompts.com
    name: Efficient GPT Prompts
    gsc_property: "sc-domain:efficientgptprompts.com"
    ga4_properties: [546666742]
    tags: []
