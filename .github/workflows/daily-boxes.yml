name: Daily product box refresh

# Every live product box is checked against Amazon once a day (Amazon asks that product data be at
# most a day old). A box whose product went out of stock, lost its image or changed is rebuilt with
# the same rules used to place it; every other post is left untouched. data/products/boxes.json
# lists the live boxes.

on:
  schedule:
    - cron: "41 3 * * *"   # daily 03:41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wordpress-writes   # never at the same time as another run that edits posts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Rebuild boxes whose products changed
        id: refresh
        env:
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          WP_AUTH_PLANTASTICHAVEN_COM: ${{ secrets.WP_AUTH_PLANTASTICHAVEN_COM }}
          WP_AUTH_GEARUPTOFIT_COM: ${{ secrets.WP_AUTH_GEARUPTOFIT_COM }}
          WP_AUTH_MICEGONEGUIDE_COM: ${{ secrets.WP_AUTH_MICEGONEGUIDE_COM }}
          WP_AUTH_GEARUPTOGROW_COM: ${{ secrets.WP_AUTH_GEARUPTOGROW_COM }}
          WP_AUTH_AFFILIATEMARKETINGFORSUCCESS_COM: ${{ secrets.WP_AUTH_AFFILIATEMARKETINGFORSUCCESS_COM }}
          WP_AUTH_FRENCHYFAB_COM: ${{ secrets.WP_AUTH_FRENCHYFAB_COM }}
          WP_AUTH_MYSTICALDIGITS_COM: ${{ secrets.WP_AUTH_MYSTICALDIGITS_COM }}
          WP_AUTH_EFFICIENTGPTPROMPTS_COM: ${{ secrets.WP_AUTH_EFFICIENTGPTPROMPTS_COM }}
        run: |
          if [ -z "$AMAZON_CREATORS_CREDENTIAL_ID" ]; then echo "No Creators API secrets: skipping"; exit 0; fi
          python -m ace refresh-boxes --apply --only-with-login --out "reports/refresh-$(date -u +%F)"

      - name: Commit what changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "commission-audit"
          git config user.email "actions@users.noreply.github.com"
          git add data/products reports backups
          git diff --cached --quiet || git commit -m "Product box refresh $(date -u +%F)"
          git pull --rebase --autostash && git push
