name: Weekly commission audit

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      apply_fixes:
        description: "Apply the fixes switched on in sites.yaml"
        type: boolean
        default: true
      submit:
        description: "Submit new and changed pages to search engines"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Pull Search Console data (skipped until the secret exists)
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GSC_SERVICE_ACCOUNT_JSON" ]; then python -m ace gsc-pull --days 28; else echo "No GSC secret: using the CSVs already in data/gsc"; fi

      - name: Crawl, score and draft fixes
        run: python -m ace run

      # Makes only the fixes listed under auto_fix in sites.yaml, and only on sites whose
      # WP_AUTH_<DOMAIN> secret exists. With no secrets this step does nothing.
      - name: Apply safe fixes
        if: github.event_name != 'workflow_dispatch' || inputs.apply_fixes
        env:
          WP_AUTH_PLANTASTICHAVEN_COM: ${{ secrets.WP_AUTH_PLANTASTICHAVEN_COM }}
          WP_AUTH_GEARUPTOFIT_COM: ${{ secrets.WP_AUTH_GEARUPTOFIT_COM }}
          WP_AUTH_MICEGONEGUIDE_COM: ${{ secrets.WP_AUTH_MICEGONEGUIDE_COM }}
          WP_AUTH_GEARUPTOGROW_COM: ${{ secrets.WP_AUTH_GEARUPTOGROW_COM }}
          WP_AUTH_AFFILIATEMARKETINGFORSUCCESS_COM: ${{ secrets.WP_AUTH_AFFILIATEMARKETINGFORSUCCESS_COM }}
          WP_AUTH_FRENCHYFAB_COM: ${{ secrets.WP_AUTH_FRENCHYFAB_COM }}
          WP_AUTH_MYSTICALDIGITS_COM: ${{ secrets.WP_AUTH_MYSTICALDIGITS_COM }}
          WP_AUTH_EFFICIENTGPTPROMPTS_COM: ${{ secrets.WP_AUTH_EFFICIENTGPTPROMPTS_COM }}
        run: python -m ace fix --apply --only-with-login

      # Tells Bing and the other IndexNow engines about pages that are new or changed since the
      # last run. Skipped until the INDEXNOW_KEY secret exists.
      - name: Submit new and changed pages to search engines
        if: github.event_name != 'workflow_dispatch' || inputs.submit
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -n "$INDEXNOW_KEY" ]; then python -m ace submit --apply; else echo "No INDEXNOW_KEY secret: skipping"; fi

      - name: Commit the report
        run: |
          git config user.name "commission-audit"
          git config user.email "actions@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || git commit -m "Weekly commission audit $(date -u +%F)"
          git push
